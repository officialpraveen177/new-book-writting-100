<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work From Home Jobs - India's Online Jobs Community</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Serif & Modern Sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@400;600;700;800&family=Source+Serif+4:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0b0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }

        /* Glowing Yellow Outer Border Frame */
        .glowing-frame {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.2);
            border-radius: 28px;
            background: linear-gradient(180deg, #18181c 0%, #0d0d10 100%);
        }

        /* Title Serif Style */
        .serif-title {
            font-family: 'Source Serif 4', Georgia, serif;
            letter-spacing: 0.5px;
        }

        /* Pulse Animation for CTA Button */
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 204, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0);
            }
        }

        .cta-btn-glow {
            animation: pulse-glow 2s infinite;
        }

        .cta-btn-glow:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.6);
        }

        /* Shiny Glass Highlight Overlay */
        .glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
        }

        /* Bottom Glowing Join Text */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 204, 0, 0.5);
        }
    </style>
</head>
<body class="selection:bg-yellow-400 selection:text-black">

    <!-- Outer Container (Responsive Width) -->
    <div class="relative w-full max-w-md glowing-frame p-6 sm:p-8 text-center overflow-hidden my-auto">
        
        <!-- Glass Overlay Effect -->
        <div class="glass-overlay"></div>

        <!-- Top Logo Section -->
        <div class="flex justify-center mb-6">
            <div class="w-28 h-28 sm:w-32 sm:h-32 bg-white rounded-xl p-2 flex items-center justify-center shadow-lg border-2 border-yellow-400">
                <!-- Circular Yellow Inner Badge -->
                <div class="w-full h-full bg-[#ffdd00] rounded-full flex flex-col items-center justify-center p-2 text-center text-black leading-tight shadow-inner">
                    <span class="font-serif font-extrabold text-xs sm:text-sm tracking-tight uppercase">work from</span>
                    <span class="font-serif font-black text-lg sm:text-xl tracking-tighter uppercase my-0.5">home</span>
                    <span class="font-serif font-extrabold text-sm sm:text-base tracking-tight uppercase">jobs</span>
                    <span class="text-[8px] font-sans font-semibold tracking-wider mt-0.5 opacity-80">online jobs</span>
                </div>
            </div>
        </div>

        <!-- Main Heading -->
        <h1 class="serif-title text-xl sm:text-2xl font-black tracking-wide text-white flex items-center justify-center gap-2 mb-3">
            <span class="text-yellow-400 text-lg sm:text-xl">★</span>
            <span>WORK FROM HOME JOBS</span>
            <span class="text-yellow-400 text-lg sm:text-xl">★</span>
        </h1>

        <!-- Subtitle -->
        <p class="serif-title text-yellow-400 font-bold text-xs sm:text-sm tracking-wider uppercase mb-5 flex items-center justify-center gap-1.5">
            <span>INDIA'S ONLINE JOBS COMMUNITY</span>
            <span class="inline-block animate-bounce">🚀</span>
        </p>

        <!-- Badge Button: ONLY FOR FEMALE -->
        <div class="inline-flex items-center justify-center bg-[#ffe600] text-black font-extrabold text-xs sm:text-sm px-5 py-2 rounded-full border border-yellow-300 shadow-md mb-6 transition-transform hover:scale-105">
            <span class="mr-1.5 text-base">👩</span>
            <span class="tracking-wider uppercase font-serif">ONLY FOR FEMALE</span>
            <span class="ml-1.5 text-base">👩</span>
        </div>

        <!-- Main Call To Action (CTA) Button -->
        <div class="mb-8">
            <a id="telegramLink" href="https://t.me/your_telegram_channel" target="_blank" rel="noopener noreferrer" 
               class="cta-btn-glow w-full bg-gradient-to-r from-yellow-400 via-yellow-300 to-yellow-500 hover:from-yellow-300 hover:to-yellow-400 text-black font-serif font-black text-base sm:text-lg py-3.5 px-6 rounded-full flex items-center justify-center gap-3 transition-all duration-300 border-2 border-yellow-200 active:scale-95 shadow-lg">
                <!-- Telegram Icon (Custom SVG / FontAwesome) -->
                <i class="fa-solid fa-paper-plane text-black text-lg transform -rotate-12"></i>
                <span>Join Telegram Channel</span>
                <i class="fa-solid fa-paper-plane text-black text-lg transform -rotate-12"></i>
            </a>
        </div>

        <!-- Features List -->
        <div class="space-y-3 text-left max-w-xs mx-auto mb-8 text-xs sm:text-sm font-bold tracking-wide">
            <div class="flex items-center gap-2.5 text-white">
                <span class="text-emerald-500 text-base flex-shrink-0">✅</span>
                <span class="uppercase">GENUINE &amp; VERIFIED JOBS</span>
            </div>
            <div class="flex items-center gap-2.5 text-white">
                <span class="text-base flex-shrink-0">💼</span>
                <span class="uppercase">DAILY NEW JOB UPDATES</span>
            </div>
            <div class="flex items-center gap-2.5 text-white">
                <span class="text-base flex-shrink-0">💵</span>
                <span class="uppercase">FLEXIBLE INCOME OPPORTUNITIES</span>
            </div>
            <div class="flex items-center gap-2.5 text-white">
                <span class="text-base flex-shrink-0">⏰</span>
                <span class="uppercase">PART-TIME / FULL-TIME AVAILABLE</span>
            </div>
        </div>

        <!-- Bottom Text -->
        <div class="pt-2">
            <h2 class="serif-title font-black text-2xl sm:text-3xl tracking-widest text-white uppercase glow-text">
                JOIN NOW !!
            </h2>
        </div>

    </div>

    <!-- Script to dynamically customize Telegram link if needed -->
    <script>
        // AAP APNA TELEGRAM LINK YAHAN BADAL SAKTE HAIN
        const TELEGRAM_URL = "https://t.me/your_telegram_channel"; 

        document.getElementById('telegramLink').setAttribute('href', TELEGRAM_URL);
    </script>
</body>
</html>
